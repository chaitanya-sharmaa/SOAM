name: "Azure DAP Infrastructure CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "azure/**"
      - ".github/workflows/terraform-azure.yml"
  pull_request:
    branches:
      - main
    paths:
      - "azure/**"
      - ".github/workflows/terraform-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # Required for Azure Entra ID OIDC token exchange
  pull-requests: write # Required to post terraform plan comments on PRs

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: "azure/environments/dev"
  AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  AZURE_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

jobs:
  terraform-plan:
    name: "Azure Terraform Plan & Validate"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to Azure via OIDC"
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive azure/

      - name: "Terraform Init"
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: "Terraform Validate"
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate -no-color

      - name: "Terraform Plan"
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: false

      - name: "Post Plan Output to Pull Request"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const output = `### ☁️ Azure DAP Infrastructure Deployment Plan
            #### Environment: \`${{ env.WORKING_DIR }}\`
            #### Terraform Format & Style: 🖌 \`Success\`
            #### Terraform Initialization: ⚙️ \`Success\`
            #### Terraform Validation: 🤖 \`Success\`
            <details><summary>Show Plan Details</summary>

            \`\`\`hcl
            ${plan.substring(0, 60000)}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

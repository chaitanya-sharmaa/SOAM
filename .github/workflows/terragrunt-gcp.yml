name: "GCP DAP Terragrunt Multi-Env CI/CD"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "gcp/**"
      - ".github/workflows/terragrunt-gcp.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "gcp/**"
      - ".github/workflows/terragrunt-gcp.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Terragrunt Action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write      # Required for Workload Identity Federation (WIF) OIDC auth
  pull-requests: write # Required to post plan output on PRs

env:
  TF_VERSION: "1.7.5"
  TG_VERSION: "1.1.2"
  WIF_PROVIDER: "${{ secrets.GCP_WIF_PROVIDER }}"
  WIF_SERVICE_ACCOUNT: "${{ secrets.GCP_TF_SA_EMAIL }}"

jobs:
  # ==============================================================================
  # 1. Terragrunt Lint, Format & Plan on Pull Request
  # ==============================================================================
  terragrunt-plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via Workload Identity Federation"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Setup Terragrunt CLI"
        uses: gruntwork-io/setup-terragrunt@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}

      - name: "Validate Dependency DAG"
        working-directory: "gcp/live/${{ matrix.environment }}"
        run: terragrunt dag graph

      - name: "Terragrunt Plan All"
        id: tg_plan
        working-directory: "gcp/live/${{ matrix.environment }}"
        run: |
          terragrunt run --all plan --non-interactive

  # ==============================================================================
  # 2. Continuous Deployment to Dev (on merge to develop)
  # ==============================================================================
  deploy-dev:
    name: "Apply (dev)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Setup Terragrunt CLI"
        uses: gruntwork-io/setup-terragrunt@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}

      - name: "Terragrunt Apply All (Dev)"
        working-directory: "gcp/live/dev"
        run: terragrunt run --all apply --non-interactive

  # ==============================================================================
  # 3. Continuous Deployment to Prod (on merge to main)
  # ==============================================================================
  deploy-prod:
    name: "Apply (prod)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Setup Terragrunt CLI"
        uses: gruntwork-io/setup-terragrunt@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}

      - name: "Terragrunt Apply All (Prod)"
        working-directory: "gcp/live/prod"
        run: terragrunt run --all apply --non-interactive

  # ==============================================================================
  # 4. Manual Workflow Dispatch Trigger
  # ==============================================================================
  manual-execution:
    name: "Manual (${{ inputs.environment }} - ${{ inputs.action }})"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to GCP via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: "Setup Terragrunt CLI"
        uses: gruntwork-io/setup-terragrunt@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}

      - name: "Execute Terragrunt Action"
        working-directory: "gcp/live/${{ inputs.environment }}"
        run: |
          terragrunt run --all ${{ inputs.action }} --non-interactive

name: "GCP DAP Infrastructure CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "gcp/**"
      - ".github/workflows/terraform-gcp.yml"
  pull_request:
    branches:
      - main
    paths:
      - "gcp/**"
      - ".github/workflows/terraform-gcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # Required for Workload Identity Federation OIDC token exchange
  pull-requests: write # Required to post terraform plan comments on PRs

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: "gcp/environments/dev"
  WIF_PROVIDER: "${{ secrets.GCP_WIF_PROVIDER }}" # e.g. projects/123456/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  WIF_SERVICE_ACCOUNT: "${{ secrets.GCP_TF_SA_EMAIL }}" # e.g. sa-dap-tf-provisioner@my-gcp-project.iam.gserviceaccount.com

jobs:
  terraform-plan:
    name: "GCP Terraform Plan & Validate"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud via WIF"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Terraform Format Check"
        run: terraform fmt -check -recursive gcp/

      - name: "Terraform Init"
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: "Terraform Validate"
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate -no-color

      - name: "Terraform Plan"
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: false

      - name: "Post Plan Output to Pull Request"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const output = `### 🌐 GCP DAP Infrastructure Deployment Plan
            #### Environment: \`${{ env.WORKING_DIR }}\`
            #### Terraform Format & Style: 🖌 \`Success\`
            #### Terraform Initialization: ⚙️ \`Success\`
            #### Terraform Validation: 🤖 \`Success\`
            <details><summary>Show Plan Details</summary>

            \`\`\`hcl
            ${plan.substring(0, 60000)}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
